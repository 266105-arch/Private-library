
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>고전 서재</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 로그인 → 책장(표지 카드 격자) → 책 상세(설명 / 주인공 인터뷰 / 포스터). 편집자 모드는 상단 스위치로 켜고, 포스터 탭에 제작 도구가 열린다. */
:root {
  --bg: #eceff4;
  --surface: #ffffff;
  --ink: #19202f;
  --muted: #566176;
  --line: #d4d9e3;
  --accent: #29449c;
  --accent-ink: #ffffff;
  --soft: #e2e7f2;
  --edit-bg: #fbecc2;
  --edit-ink: #5c3d00;
  --danger: #a3262a;
  --ok: #1d7a4a;
  --ok-bg: #e0f3e8;
  --bad-bg: #fbe4e4;
  --font-display: 'Gowun Batang', 'Noto Serif KR', 'Batang', serif;
  --font-body: 'Noto Sans KR', system-ui, -apple-system, 'Malgun Gothic', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151f;
    --surface: #1a2030;
    --ink: #e8ebf3;
    --muted: #9ba4b8;
    --line: #2b3447;
    --accent: #93abf2;
    --accent-ink: #10162a;
    --soft: #232b3f;
    --edit-bg: #3a2f12;
    --edit-ink: #f3d78a;
    --danger: #f08a8c;
  --ok: #6cd49b;
  --ok-bg: #16301f;
  --bad-bg: #3a1a1c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151f;
  --surface: #1a2030;
  --ink: #e8ebf3;
  --muted: #9ba4b8;
  --line: #2b3447;
  --accent: #93abf2;
  --accent-ink: #10162a;
  --soft: #232b3f;
  --edit-bg: #3a2f12;
  --edit-ink: #f3d78a;
  --danger: #f08a8c;
  --ok: #6cd49b;
  --ok-bg: #16301f;
  --bad-bg: #3a1a1c;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.65;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
  min-height: 100%;
  word-break: keep-all;
  overflow-wrap: break-word;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--bg);
  z-index: 10;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p { margin: 0; }
.wrap { max-width: 1040px; margin: 0 auto; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* 공통 버튼 */
.btn {
  background: var(--accent); color: var(--accent-ink);
  border: 0; border-radius: 8px; padding: 10px 18px; font-weight: 700; min-height: 44px;
}
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
.btn.danger { background: var(--danger); color: var(--bg); }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 14px; }
.btn:hover { filter: brightness(1.08); }

/* 로그인 */
body.on-login::before { background: #0d1120; }
body.on-login #app { max-width: none; }
.stage {
  --s-ink: #eef1fa; --s-mute: #a3acc4; --s-line: rgba(255, 255, 255, .16); --s-acc: #9db4f5; --s-accink: #0f1530;
  background: radial-gradient(60% 55% at 72% 42%, rgba(120, 150, 255, .20), rgba(120, 150, 255, 0) 70%), linear-gradient(160deg, #0d1120 0%, #151b34 100%);
  color: var(--s-ink);
  margin: 0 calc(-1 * max(16px, env(safe-area-inset-right, 0px))) -48px calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100vh; display: grid; align-items: center;
}
.stage :focus-visible { outline-color: var(--s-acc); }
.stage-in { max-width: 1040px; margin: 0 auto; width: 100%; display: grid; gap: 30px; padding-block: 36px 60px; }
.stage .fan-col { order: -1; min-width: 0; }
.stage .copy { min-width: 0; }
@media (min-width: 880px) {
  .stage-in { grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr); gap: 56px; align-items: center; }
  .stage .fan-col { order: 0; }
}
.eyebrow { display: flex; align-items: center; gap: 12px; font-size: 12px; letter-spacing: .24em; text-transform: uppercase; color: var(--s-acc); }
.eyebrow::after { content: ""; flex: 0 0 56px; height: 1px; background: var(--s-line); }
.stage h1 { font-family: var(--font-display); font-size: clamp(46px, 9vw, 78px); line-height: 1.05; letter-spacing: -.02em; margin-top: 14px; }
.stage .lead { color: var(--s-mute); margin-top: 16px; max-width: 29em; font-size: 17px; }
.stage form { display: grid; gap: 10px; margin-top: 30px; max-width: 430px; }
.stage label { font-size: 13px; letter-spacing: .08em; color: var(--s-mute); }
.nameline { display: flex; gap: 10px; }
.stage .field { background: rgba(255, 255, 255, .06); border: 1px solid var(--s-line); color: var(--s-ink); border-radius: 10px; flex: 1; min-width: 0; }
.stage .field::placeholder { color: rgba(238, 241, 250, .45); }
.stage .go { background: var(--s-acc); color: var(--s-accink); border: 0; border-radius: 10px; font-weight: 700; padding: 0 22px; min-height: 46px; white-space: nowrap; }
.stage .go:hover { filter: brightness(1.08); }
.stage .hint { color: var(--s-mute); }
.stage .err { color: #ffb3b5; }
.feat { list-style: none; margin: 34px 0 0; padding: 18px 0 0; border-top: 1px solid var(--s-line); display: flex; flex-wrap: wrap; gap: 8px 22px; color: var(--s-mute); font-size: 14px; max-width: 430px; }
.feat b { color: var(--s-ink); font-weight: 500; }
.fan { position: relative; width: 94%; margin: 0 auto; aspect-ratio: 10 / 6.9; }
.fc { position: absolute; width: 30%; left: var(--x); top: var(--y); transform: rotate(var(--r)); z-index: var(--z); transition: transform .35s ease; animation: rise .8s cubic-bezier(.2, .7, .2, 1) backwards; animation-delay: calc(var(--i) * 70ms); }
.fc:hover { transform: translateY(-10px) rotate(0deg); z-index: 9; }
.fc .cover { box-shadow: 0 18px 30px rgba(0, 0, 0, .5); }
@keyframes rise { from { transform: translateY(26px) rotate(var(--r)); } to { transform: translateY(0) rotate(var(--r)); } }
@keyframes rise2 { from { transform: translateY(26px) rotate(var(--dr)); } to { transform: translateY(0) rotate(var(--dr)); } }
.stage { overflow-x: clip; }
@media (min-width: 880px) {
  .fan { aspect-ratio: 1 / 1.04; width: 100%; margin: 0; }
  .fc { left: var(--dx); top: var(--dy); transform: rotate(var(--dr)); animation-name: rise2; }
  .fc:hover { transform: translateY(-10px) rotate(0deg); }
}

.field {
  width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 11px 14px; min-height: 46px;
}
textarea.field { resize: vertical; min-height: 76px; }
.hint { font-size: 13px; color: var(--muted); }
.err { color: var(--danger); font-size: 14px; min-height: 1.4em; }

/* 상단 바 */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar { max-width: 1040px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding-block: 10px; }
.brand { background: none; border: 0; font-family: var(--font-display); font-weight: 700; font-size: 22px; padding: 4px 0; margin-right: auto; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 6px 14px; font-size: 14px; min-height: 34px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.seg button.edit[aria-pressed="true"] { background: var(--edit-bg); color: var(--edit-ink); outline: 1px solid var(--edit-ink); }
.who { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); min-width: 0; }
.who span { max-width: 9em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.edit-banner { background: var(--edit-bg); color: var(--edit-ink); font-size: 14px; padding: 8px 14px; border-radius: 8px; margin-top: 14px; }

/* 책장 */
.home-head { padding-top: 28px; display: grid; gap: 4px; }
.home-head h2 { font-family: var(--font-display); font-size: clamp(24px, 5vw, 34px); line-height: 1.3; text-wrap: balance; }
.home-head p { color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 22px 16px; margin-top: 22px; }
@media (min-width: 700px) { .grid { grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 30px 18px; } }
.card { display: grid; gap: 10px; text-align: left; background: none; border: 0; padding: 0; min-width: 0; align-content: start; }
.card .ct { font-family: var(--font-display); font-weight: 700; font-size: 18px; line-height: 1.3; }
.card .cm { font-size: 13px; color: var(--muted); }
.card .cl { font-size: 14px; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .cb { font-size: 12px; color: var(--accent); font-weight: 700; }
.card .cover { transition: transform .18s ease, box-shadow .18s ease; }
.card:hover .cover { transform: translateY(-4px); box-shadow: 0 12px 22px rgba(10, 16, 40, .28); }

/* 표지 */
.cover {
  aspect-ratio: 5 / 8; position: relative; background: var(--c); color: var(--f);
  border-radius: 3px 9px 9px 3px; container-type: inline-size; width: 100%; max-width: 100%;
  box-shadow: 0 5px 12px rgba(10, 16, 40, .22);
}
.cover::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 7%; background: linear-gradient(90deg, rgba(0,0,0,.32), rgba(0,0,0,0)); border-radius: 3px 0 0 3px; }
.cover .frame {
  position: absolute; inset: 6cqw 6cqw 6cqw 11cqw; border: 1px solid color-mix(in srgb, var(--f) 50%, transparent);
  display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center; padding: 7cqw 4cqw 6cqw;
}
.cover .motif { width: 34cqw; height: 34cqw; opacity: .9; }
.cover .ctitle { font-family: var(--font-display); font-weight: 700; font-size: 10.5cqw; line-height: 1.22; text-wrap: balance; }
.cover .cauthor { font-size: 4.6cqw; letter-spacing: .08em; opacity: .85; }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: inherit; display: block; }
.cover.has-img::before { z-index: 1; width: 5%; background: linear-gradient(90deg, rgba(0,0,0,.28), rgba(0,0,0,0)); }
.card.add .addbox { aspect-ratio: 5 / 8; border: 2px dashed var(--line); border-radius: 9px; display: grid; place-items: center; align-content: center; gap: 6px; color: var(--muted); text-align: center; padding: 12px; }
.card.add:hover .addbox { border-color: var(--accent); color: var(--accent); }
.card.add .plus { font-size: 38px; line-height: 1; }

/* 책 추가 폼 */
.bform { display: grid; gap: 16px; max-width: 640px; }
.bform .row2 { display: grid; gap: 14px; }
@media (min-width: 600px) { .bform .row2 { grid-template-columns: 1fr 1fr; } }
.bform fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 18px; display: grid; gap: 14px; margin: 0; min-width: 0; }
.bform legend { font-weight: 700; font-size: 14px; padding: 0 6px; }
.coverpick { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 16px; align-items: start; }
.coverpick .side { display: grid; gap: 10px; min-width: 0; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.swatches label { cursor: pointer; position: relative; }
.swatches input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.swatches i { display: block; width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line); }
.swatches input:checked + i { box-shadow: 0 0 0 3px var(--accent); }
.swatches input:focus-visible + i { outline: 3px solid var(--accent); outline-offset: 2px; }

/* 상세 */
.back { background: none; border: 0; color: var(--muted); padding: 14px 0 6px; min-height: 44px; }
.hero { display: grid; grid-template-columns: 128px 1fr; gap: 20px; align-items: end; margin-top: 4px; }
@media (min-width: 700px) { .hero { grid-template-columns: 170px 1fr; gap: 28px; } }
.hero h2 { font-family: var(--font-display); font-size: clamp(26px, 6vw, 42px); line-height: 1.2; text-wrap: balance; }
.hero .en { color: var(--muted); font-size: 14px; margin-top: 2px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.tag { background: var(--soft); border-radius: 999px; padding: 3px 11px; font-size: 13px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-top: 24px; overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; color: var(--muted); white-space: nowrap; min-height: 46px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--accent); font-weight: 700; }
.panel { padding-top: 22px; display: grid; gap: 20px; }
.panel h3 { font-family: var(--font-display); font-size: 22px; }
.prose { max-width: 66ch; }
.cols { display: grid; gap: 22px; }
@media (min-width: 760px) { .cols { grid-template-columns: 1fr 1fr; } }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; display: grid; gap: 10px; align-content: start; }
.box h3 { font-size: 18px; }
.pts { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.chars { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.chars b { font-weight: 700; }
.chars span { color: var(--muted); display: block; font-size: 14px; }

/* 인터뷰 */
.who-card { display: flex; gap: 14px; align-items: center; }
.avatar { flex: none; width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; background: var(--c); color: var(--f); font-family: var(--font-display); font-weight: 700; font-size: 24px; }
.who-card p { color: var(--muted); font-size: 14px; }
.chat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; min-height: 160px; max-height: 420px; overflow-y: auto; align-content: start; }
.msg { max-width: 86%; padding: 10px 14px; border-radius: 14px; width: fit-content; }
.msg.c { background: var(--soft); border-bottom-left-radius: 4px; }
.msg.u { background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; justify-self: end; }
.msg.pending { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-size: 14px; min-height: 40px; text-align: left; }
.chip:hover:not([aria-disabled="true"]) { border-color: var(--accent); }
.chip[aria-disabled="true"] { opacity: .5; cursor: default; }
.ask { display: flex; gap: 8px; }
.ask .field { flex: 1; min-width: 0; }

/* 포스터 */
.ptab-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
.notice { background: var(--soft); border-radius: 8px; padding: 8px 14px; font-size: 14px; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr)); gap: 26px 22px; }
.pcard { display: grid; gap: 10px; align-content: start; min-width: 0; }
.pmeta { font-size: 13px; color: var(--muted); }
.pact { display: flex; gap: 8px; flex-wrap: wrap; }
.poster-wrap { container-type: inline-size; width: 100%; }
.poster {
  background: var(--pbg); color: var(--pfg); aspect-ratio: 3 / 4; border-radius: 6px; position: relative;
  padding: 7cqw; display: flex; flex-direction: column; justify-content: space-between; gap: 5cqw;
  box-shadow: 0 6px 16px rgba(10, 16, 40, .22);
}
.poster::after { content: ""; position: absolute; inset: 3cqw; border: 1px solid var(--pacc); opacity: .45; pointer-events: none; }
.p-motif { position: absolute; top: 8cqw; right: 8cqw; width: 19cqw; height: 19cqw; color: var(--pacc); opacity: .85; }
.p-kicker { font-size: 3.3cqw; letter-spacing: .14em; opacity: .8; }
.p-title { font-family: var(--font-display); font-weight: 700; font-size: 11.5cqw; line-height: 1.15; margin-top: 3cqw; max-width: 70%; text-wrap: balance; }
.p-mid { display: grid; gap: 3.5cqw; }
.p-head { font-family: var(--font-display); font-size: 5.6cqw; line-height: 1.4; font-weight: 700; text-wrap: balance; }
.p-pts { margin: 0; padding: 0; list-style: none; display: grid; gap: 2cqw; }
.p-pts li { font-size: 4cqw; line-height: 1.45; padding-left: 4.6cqw; position: relative; }
.p-pts li::before { content: ""; position: absolute; left: 0; top: 1.9cqw; width: 2.2cqw; height: 2.2cqw; background: var(--pacc); border-radius: 50%; }
.p-foot { display: flex; justify-content: space-between; gap: 3cqw; font-size: 3.2cqw; opacity: .85; border-top: 1px solid color-mix(in srgb, var(--pfg) 35%, transparent); padding-top: 2.4cqw; }

/* 편집기 */
.editor { display: grid; gap: 24px; }
@media (min-width: 800px) { .editor { grid-template-columns: minmax(0, 1fr) minmax(0, 340px); align-items: start; } }
.form { display: grid; gap: 14px; }
.form label.lb, .bform label.lb { font-weight: 700; font-size: 14px; display: grid; gap: 6px; }
.themes { display: flex; flex-wrap: wrap; gap: 8px; }
.themes label { border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; background: var(--surface); display: flex; gap: 8px; align-items: center; min-height: 42px; cursor: pointer; }
.themes input { accent-color: var(--accent); }
.themes label:has(input:checked) { border-color: var(--accent); outline: 1px solid var(--accent); }
.fbtns { display: flex; gap: 8px; flex-wrap: wrap; }

/* 책장 도구 */
.tools { display: grid; gap: 12px; margin-top: 18px; }
@media (min-width: 700px) { .tools { grid-template-columns: minmax(0, 320px) 1fr; align-items: center; } }
.fchips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.empty { grid-column: 1 / -1; color: var(--muted); padding: 20px 0; }
.statusrow { margin-top: 14px; display: grid; gap: 6px; }
.statusrow .hint { margin: 0; }

/* 퀴즈 */
.qintro p { max-width: 52ch; }
.qprog { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--muted); }
.bar2 { flex: 1; height: 6px; border-radius: 999px; background: var(--soft); overflow: hidden; }
.bar2 i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.qq { font-family: var(--font-display); font-size: 21px; line-height: 1.45; text-wrap: balance; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; gap: 12px; align-items: center; text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-height: 52px; }
.opt .ol { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--muted); }
.opt:hover:not([aria-disabled="true"]) { border-color: var(--accent); }
.opt[aria-disabled="true"] { cursor: default; }
.opt.ok { border-color: var(--ok); background: var(--ok-bg); }
.opt.ok .ol { background: var(--ok); border-color: var(--ok); color: var(--bg); }
.opt.bad { border-color: var(--danger); background: var(--bad-bg); }
.qfb { border-radius: 10px; padding: 12px 14px; }
.qfb p { margin-top: 4px; font-size: 14px; }
.qfb.ok { background: var(--ok-bg); }
.qfb.bad { background: var(--bad-bg); }
.qscore { font-size: 18px; }
.qscore b { font-family: var(--font-display); font-size: 48px; }
.review { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }

  /* ---------- 퀴즈 ---------- */

  function shuffle(a) {

    return a;

  function quizHTML(b) {

    var d = state.editor.draft;
    if (f === 'theme') d.theme = e.target.value;
    else if (f.indexOf('pt') === 0) d.points[Number(f.slice(2))] = e.target.value;
    else d[f] = e.target.value;
    var pv = $('#pvPoster');
    if (pv) pv.innerHTML = posterHTML(d, bookById(state.bookId));
  });

  app.addEventListener('change', function (e) {
    if (e.target.id === 'bfFile' && e.target.files) readCover(e.target.files[0]);
    if (e.target.id === 'pfFile' && e.target.files) readPhoto(e.target.files[0]);
  });

  app.addEventListener('submit', function (e) {
    e.preventDefault();
    if (e.target.id === 'loginForm') {
      var name = $('#loginName').value.trim();
      if (!name) { $('#loginErr').textContent = '이름을 입력해 주세요.'; $('#loginName').focus(); return; }
      state.user = { name: name };
      store('gojeon.user', state.user);
      state.me = loadMe(); state.q = ''; state.filter = 'all';
      state.view = 'home';
      render();
    } else if (e.target.id === 'askForm') {
      var inp = $('#askInput');
      var q = inp.value.trim();
      if (!q || !sampleFn) return;
      inp.value = '';
      askFree(bookById(state.bookId), q);
    }
  });

  render();
})();
</script>

</body>
</html>
